# =============================================================================
# Agendador das rotinas em produção.
#
# POR QUE ISTO EXISTE
#
# A Vercel só oferece cron em plano pago, e o app roda no gratuito. Sem um
# agendador nada dispara as rotinas: o calendário não é buscado, o placar ao
# vivo não avança e as dicas congelam no último dado gravado. Foi exatamente o
# que aconteceu — a tela ficou uma hora atrás da realidade, mostrando um jogo
# no intervalo quando ele já tinha acabado 2 a 0.
#
# GitHub Actions cobre isso de graça, e o repositório já está aqui.
#
# O QUE PRECISA SER CONFIGURADO
#
#   Settings → Secrets and variables → Actions → New repository secret
#
#     WORKER_SECRET   o mesmo valor que está na Vercel. É o único obrigatório.
#
#     APP_URL         opcional. O endereço de produção já está no bloco `env`
#                     abaixo, verificado. Só crie este segredo para apontar a
#                     outro ambiente sem mexer no código.
#
#     VERCEL_BYPASS   só se o projeto estiver com Deployment Protection ligado.
#                     Vercel → Settings → Deployment Protection → Protection
#                     Bypass for Automation → gere o segredo e cole aqui. Sem
#                     ele, a proteção responde com o SSO da Vercel a qualquer
#                     chamada automática e nenhuma rotina roda.
#
# LIMITE CONHECIDO
#
# O cron do GitHub tem intervalo mínimo de 5 minutos e costuma atrasar alguns
# minutos quando a plataforma está carregada. Para acompanhar jogo ao vivo é
# aceitável, não é ideal. Precisão de segundos exigiria cron dedicado ou o
# plano pago da Vercel.
#
# As rotinas têm cooldown próprio no banco, então disparar com frequência não
# gasta quota de API à toa: a chamada simplesmente não faz nada se for cedo.
# =============================================================================
name: Rotinas de produção

on:
  schedule:
    - cron: '*/5 * * * *' # ao vivo e liquidação
    - cron: '*/30 * * * *' # cotações e calls do Telegram
    - cron: '10 3,11,19 * * *' # calendário, desempenho e bilhetes
  workflow_dispatch:
    inputs:
      job:
        description: 'Rotina de sports a executar'
        required: false
        default: 'live'
        type: choice
        options: [live, odds, fixtures, settle, performance, all]

env:
  # Endereço de produção, verificado: /api/health responde {"app":"banca"}.
  #
  # Fica no arquivo porque não é segredo e porque poupa uma configuração
  # manual. O segredo APP_URL, se existir, tem prioridade — serve para apontar
  # a outro ambiente sem mexer no código.
  #
  # Deduzir este endereço do nome do projeto foi um erro que já custou caro:
  # `banca-app.vercel.app` pertence a outra pessoa. Por isso o passo seguinte
  # confere a identidade do app antes de rodar qualquer rotina, em vez de
  # confiar num 200.
  APP_URL: ${{ secrets.APP_URL || 'https://banca-app-pied.vercel.app' }}
  WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
  VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # Traz .github/chamar.sh, usado pelos passos abaixo.
      # v5 e não v4: o GitHub está removendo o Node 20 dos runners, e a v4
      # já roda com aviso de depreciação.
      - uses: actions/checkout@v5

      # Falha cedo e com mensagem clara: um cron que erra em silêncio é pior
      # que cron nenhum, porque parece estar funcionando.
      - name: Conferir configuração
        run: |
          faltou=0
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL não configurado. Pegue o endereço em Vercel → Settings → Domains e crie o segredo em Settings → Secrets and variables → Actions."
            faltou=1
          fi
          if [ -z "$WORKER_SECRET" ]; then
            echo "::error::WORKER_SECRET não configurado. Use o mesmo valor que está na Vercel."
            faltou=1
          fi
          [ "$faltou" -eq 1 ] && exit 1
          echo "Alvo: $APP_URL"

      # Uma chamada barata que prova três coisas antes de gastar quota de API:
      # o endereço existe, é o app certo, e a proteção da Vercel deixa passar.
      - name: Verificar que o alvo responde e é o app certo
        run: |
          url="$APP_URL/api/health"
          [ -n "$VERCEL_BYPASS" ] && url="$url?x-vercel-protection-bypass=$VERCEL_BYPASS"
          corpo=$(curl -sS --max-time 30 -w '\n%{http_code}' "$url" || true)
          codigo=$(echo "$corpo" | tail -1)
          echo "$corpo" | head -c 400
          echo ""
          if [ "$codigo" != "200" ]; then
            echo "::error::/api/health devolveu HTTP $codigo. Se for 401 ou 302 para vercel.com, o projeto está com Deployment Protection: configure VERCEL_BYPASS. Se for 307 para /login, o APP_URL aponta para outro aplicativo."
            exit 1
          fi
          if ! echo "$corpo" | grep -q '"app":"banca"'; then
            echo "::error::O endereço respondeu, mas não é este aplicativo — /api/health não trouxe a identificação esperada. Confira o APP_URL em Vercel → Settings → Domains."
            exit 1
          fi

      - name: Ao vivo e liquidação
        if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
        env:
          JOB: ${{ github.event.inputs.job || 'live' }}
        run: |
          for rotina in "$JOB" settle; do
            bash .github/chamar.sh "sports?job=$rotina"
          done

      - name: Cotações e calls
        if: github.event.schedule == '*/30 * * * *'
        run: |
          bash .github/chamar.sh "sports?job=odds"
          bash .github/chamar.sh "bilhetes?job=calls"

      - name: Calendário, desempenho e bilhetes
        if: github.event.schedule == '10 3,11,19 * * *'
        run: |
          bash .github/chamar.sh "sports?job=fixtures"
          bash .github/chamar.sh "sports?job=performance"
          bash .github/chamar.sh "bilhetes?job=all"
